name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: pip install "fastapi[standard]" boto3 "langchain-aws>=1.9.0" langchain-chroma langchain-text-splitters httpx2 pydantic pytest ruff
      - run: ruff check .
      - run: pytest
